name: CI - Build y Pruebas

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compilar proyecto
        run: mvn -B compile

  unit-tests:
    name: Pruebas unitarias (JUnit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Ejecutar pruebas unitarias
        run: mvn -B test

      - name: Publicar reporte de pruebas unitarias
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-pruebas-unitarias
          path: target/surefire-reports/

  integration-tests:
    name: Pruebas de integración (Selenium)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Ejecutar pruebas de integración
        run: mvn -B verify

      - name: Publicar reporte de pruebas de integración
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-pruebas-integracion
          path: target/failsafe-reports/
